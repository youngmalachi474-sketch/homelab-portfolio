# Sanitized copy read from a server on 2026-10-11. Review before use.
debug: false
flags:
  no_logo: false
  no_start: false
relay:
  enabled: false
directories:
  incomplete: /incomplete
  downloads: /downloads
shares:
  directories:
  - /shared
  filters:
  - \.ini$
  - Thumbs.db$
  - \.DS_Store$
  cache:
    storage_mode: memory
    workers: 16
    retention: null
web:
  port: 5030
  authentication:
    REDACTED: REDACTED
soulseek:
  address: vps.slsknet.org
  port: 2271
  username: REDACTED
  password: REDACTED
  distributed_network:
    disabled: false
    disable_children: false
    child_limit: 25
  connection:
    timeout:
      connect: 16000
      inactivity: 18000
      transfer: 30000
