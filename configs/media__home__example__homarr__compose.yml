# Sanitized copy read from a server on 2026-10-11. Review before use.
services:
  homarr:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    ports:
    - 7575:7575
    volumes:
    - /home/example/homarr/appdata:/appdata
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
    extra_hosts:
    - host.docker.internal:host-gateway
