# Sanitized copy read from a server on 2026-10-11. Review before use.
services:
  lidarr:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
    - PUID=1000
    - PGID=1001
    - TZ=America/Chicago
    - UMASK=002
    volumes:
    - /home/example/arr-stack/config/lidarr:/config
    - /mnt/media:/media
    ports:
    - 8686:8686
    restart: unless-stopped
  sonarr:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
    - PUID=1000
    - PGID=1001
    - TZ=America/Chicago
    - UMASK=002
    volumes:
    - /home/example/arr-stack/config/sonarr:/config
    - /mnt/media:/media
    ports:
    - 8989:8989
    restart: unless-stopped
  radarr:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
    - PUID=1000
    - PGID=1001
    - TZ=America/Chicago
    - UMASK=002
    volumes:
    - /home/example/arr-stack/config/radarr:/config
    - /mnt/media:/media
    ports:
    - 7878:7878
    restart: unless-stopped
  prowlarr:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
    - PUID=1000
    - PGID=1001
    - TZ=America/Chicago
    - UMASK=002
    volumes:
    - /home/example/arr-stack/config/prowlarr:/config
    ports:
    - 9696:9696
    restart: unless-stopped
  seerr:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
    - LOG_LEVEL=info
    - TZ=America/Chicago
    - PORT=5055
    volumes:
    - /home/example/arr-stack/config/seerr:/app/config
    ports:
    - 5055:5055
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public
        || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
  flaresolverr:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
    - LOG_LEVEL=info
    - TZ=America/Chicago
    ports:
    - 8191:8191
    restart: unless-stopped
  soularr:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: mrusse08/soularr:latest
    container_name: soularr
    hostname: soularr
    user: 1000:1001
    environment:
    - TZ=America/Chicago
    - SCRIPT_INTERVAL=300
    - WEBUI_ENABLED=true
    - WEBUI_PORT=8265
    ports:
    - 8265:8265
    volumes:
    - /mnt/media/downloads/soulseek:/downloads
    - /home/example/arr-stack/config/soularr:/data
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
  qbittorrent:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
    - gluetun
    environment:
    - PUID=1000
    - PGID=1001
    - TZ=America/Chicago
    - UMASK=002
    - WEBUI_PORT=8080
    - TORRENTING_PORT=6881
    volumes:
    - /home/example/arr-stack/config/qbittorrent:/config
    - /mnt/media:/media
    restart: unless-stopped
  gluetun:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    env_file:
    - /home/example/arr-stack/gluetun.env
    ports:
    - 8080:8080
    restart: unless-stopped
